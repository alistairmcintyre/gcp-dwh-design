version: 2

exposures:
  - name: marketing_acquisition_dashboard
    label: "Marketing Acquisition Dashboard"
    type: dashboard
    maturity: high
    url: https://bi.example.com/dashboards/acquisition
    description: >
      Daily installs, registrations and first deposits by acquisition channel and platform; used by the
      marketing team to monitor campaign performance and channel mix.
    depends_on:
      - ref('fct_acquisition_events')
    owner:
      name: Marketing Analytics
      email: marketing-analytics@example.com

  - name: client_activity_dashboard
    label: "Client Activity & Revenue Dashboard"
    type: dashboard
    maturity: medium
    url: https://bi.example.com/dashboards/client-activity
    description: >
      Daily notional traded, trading revenue, deposits and withdrawals by client and acquisition
      channel; used by trading and finance for revenue and client-value reporting.
    depends_on:
      - ref('fct_client_activity')
    owner:
      name: Trading & Finance
      email: trading-analytics@example.com
