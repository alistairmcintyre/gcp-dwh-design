[project]
name = "gcp-dwh-design"
version = "0.1.0"
description = "dbt + Airflow/Composer (BigQuery) with a local DuckDB mirror — AppsFlyer / sports-betting demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

# The default `dev` group is the local dbt loop (DuckDB) + the data generator + lint/test tooling.
# Airflow and Dagster are NOT installed here: neither resolves alongside dbt (protobuf 4 vs 5/6), so each
# gets its own environment from a requirements file (airflow/docker/, dagster/requirements.txt).
[dependency-groups]
dev = [
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.10,<1.11",
    "dbt-bigquery>=1.10,<1.11",
    "duckdb>=1.1",
    "faker>=30",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "sqlfluff>=3.2",
    "sqlfluff-templater-dbt>=3.2",
    "pre-commit>=4",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
